  </defs>
  
  <g filter="url(#shadow)">
    <!-- Shield Base -->
    <path d="M100 10C50 10 20 50 20 90C20 150 60 180 100 195C140 180 180 150 180 90C180 50 150 10 100 10Z" fill="url(#shieldGrad)" stroke="#FFB800" stroke-width="6"/>
    
    <!-- Quadrants Divider -->
    <path d="M100 10V195M20 90H180" stroke="#FFB800" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Icon: D20 (Top Left) -->
    <path d="M60 40L75 50L60 60L45 50Z" fill="white" fill-opacity="0.9"/>
    <path d="M60 60L75 50L75 70L60 80L45 70L45 50Z" stroke="white" stroke-width="1.5" fill="none"/>
    
    <!-- Icon: Cards (Top Right) -->
    <rect x="120" y="45" width="20" height="28" rx="2" fill="white" transform="rotate(15 130 59)" fill-opacity="0.8"/>
    <rect x="135" y="45" width="20" height="28" rx="2" fill="#FFB800" transform="rotate(-10 145 59)"/>
    
    <!-- Icon: Meeple (Bottom Left) -->
    <path d="M60 115C65 115 65 120 70 120C75 120 75 125 70 130L74 145L60 138L46 145L50 130C45 125 45 120 50 120C55 120 55 115 60 115Z" fill="#FFB800"/>
    
    <!-- Icon: Chess Pawn (Bottom Right) -->
    <path d="M140 120C145 120 148 123 148 128C148 135 140 140 140 140C140 140 132 135 132 128C132 123 135 120 140 120Z" fill="white"/>
    <path d="M135 142H145L148 155H132L135 142Z" fill="white"/>
  </g>
</svg>