version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sdt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sociodotabuleiro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sociodotabuleiro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdt-network

  # API Backend (Fastify + Prisma)
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: sdt-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      LOG_LEVEL: debug
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sociodotabuleiro}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sociodotabuleiro}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src:delegated
      - ./packages:/app/packages:delegated
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sdt-network
    command: sh -c "pnpm db:generate && pnpm dev:api"

  # Web Frontend (Vite + React)
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: sdt-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src:delegated
      - ./apps/web/index.html:/app/apps/web/index.html:delegated
      - ./packages:/app/packages:delegated
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      - api
    networks:
      - sdt-network

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: sdt-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      - postgres
    networks:
      - sdt-network

volumes:
  postgres_data:
    driver: local

networks:
  sdt-network:
    driver: bridge