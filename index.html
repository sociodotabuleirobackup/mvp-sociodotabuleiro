
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sócio do Tabuleiro</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Compilador Babel para rodar TSX/JSX no navegador sem Build Step -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#6b26d9', // Royal Purple
                hover: '#5b20b9',
                light: '#8b5cf6'
              },
              accent: {
                DEFAULT: '#FFB800', // Golden Amber
                hover: '#e5a600'
              },
              background: '#050505', // Obsidian Black
              surface: '#121212',
              glass: 'rgba(255, 255, 255, 0.05)',
              border: 'rgba(255, 255, 255, 0.1)'
            },
            fontFamily: {
              sans: ['Noto Sans', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
              fantasy: ['Cinzel', 'serif']
            },
            backgroundImage: {
              'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
            }
          }
        }
      }
    </script>
    <style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #050505;
        color: #ffffff;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b26d9;
      }
      .glass-panel {
        background: rgba(30, 30, 35, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0?dev",
    "react/": "https://esm.sh/react@18.2.0/?dev",
    "react-dom": "https://esm.sh/react-dom@18.2.0?dev",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/?dev",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client?dev",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?dev",
    "dotenv": "https://esm.sh/dotenv@16.4.5",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "fs": "https://esm.sh/fs@^0.0.1-security",
    "path": "https://esm.sh/path@^0.12.7",
    "@prisma/client": "https://esm.sh/@prisma/client@^7.1.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react-router": "https://esm.sh/react-router@^7.11.0",
    "firebase-admin/": "https://esm.sh/firebase-admin@^13.6.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <!-- Script com type="text/babel" para o Babel processar o TSX -->
    <script type="text/babel" data-type="module" src="./index.tsx" data-presets="typescript,react"></script>
  </body>
</html>
